name: docintel-regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install package
        run: uv sync --extra dev
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Compile application
        run: uv run python -m compileall -q app docintel tests scripts
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build fixture indexes
        run: make ingest-fixtures
      - name: Run dual-domain regression gates
        run: |
          python -m docintel evaluate --domain tech_support --index artifacts/tech_support_index.jsonl --gold data/fixtures/tech_support/gold.jsonl --report artifacts/tech_support_eval.json --min-recall-at-5 0.80 --min-citation-accuracy 0.80 --min-abstention-correct 0.80
          python -m docintel evaluate --domain esg --index artifacts/esg_index.jsonl --gold data/fixtures/esg/gold.jsonl --report artifacts/esg_eval.json --min-recall-at-5 0.80 --min-citation-accuracy 0.80 --min-abstention-correct 0.80
      - name: Upload regression reports
        uses: actions/upload-artifact@v4
        with:
          name: docintel-regression-reports
          path: artifacts/*_eval.json

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke dependencies
        run: uv sync --extra dev
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build runtime images
        run: docker compose build api worker sandbox-worker frontend
      - name: Start Compose stack
        run: docker compose up -d
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/ready && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api worker
          exit 1
      - name: Run full local smoke flow
        run: uv run python scripts/compose_smoke.py
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color api worker | tail -n 300
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate configuration
        run: |
          terraform init -backend=false
          terraform validate
