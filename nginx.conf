server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Docker service IPs change during rolling restarts. Resolve the service name
  # through Docker DNS at request time instead of pinning the old container IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    set $docintel_api http://api:8000;
    proxy_pass $docintel_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /auth/ {
    set $docintel_api http://api:8000;
    proxy_pass $docintel_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
